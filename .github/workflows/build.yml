name: Test web app & build Android APK
on:
  push:
    branches: [arena/80cef757-pdf-reader, main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm test
      - run: npm run build
      - run: node --check dist/sw.js
      - name: Browser integration & offline tests
        run: |
          npm run preview -- --port 4173 &
          npx wait-on --timeout 30000 http-get://localhost:4173
          set +e
          export TEST_URL=http://localhost:4173 TEST_OFFLINE=1
          (npm run test:e2e && npm run test:large) > e2e.log 2>&1
          RESULT=$?
          cat e2e.log
          if [ "$RESULT" -ne 0 ]; then
            node -e "let s=require('fs').readFileSync('e2e.log','utf8').slice(-3500);console.log('::error::'+s.replace(/%/g,'%25').replace(/\n/g,'%0A').replace(/\r/g,'%0D'))"
            exit "$RESULT"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: FlipVault-Pro-web
          path: dist
  android:
    permissions:
      contents: write
    runs-on: ubuntu-24.04
    needs: verify
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Use runner Android SDK
        run: |
          test -d "$ANDROID_HOME"
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - run: npm ci
      - run: npm run build
      - run: npx cap sync android
      - name: Assemble installable Android preview
        working-directory: android
        run: |
          chmod +x gradlew
          set +e
          ./gradlew :app:assembleDebug :app:assembleDebugAndroidTest --no-daemon > gradle.log 2>&1
          RESULT=$?
          tail -150 gradle.log
          if [ "$RESULT" -ne 0 ]; then
            node -e "let s=require('fs').readFileSync('gradle.log','utf8').slice(-3500);console.log('::error::'+s.replace(/%/g,'%25').replace(/\n/g,'%0A').replace(/\r/g,'%0D'))"
            exit "$RESULT"
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: FlipVault-Pro-Android
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - name: Publish downloadable preview
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk FlipVault-Pro-Android-preview.apk
          (cd dist && zip -q -r ../FlipVault-Pro-web.zip .)
          TAG="preview-${GITHUB_SHA:0:7}"
          gh release create "$TAG" --target "$GITHUB_SHA" --prerelease \
            --title "FlipVault Pro · Android preview ${GITHUB_SHA:0:7}" \
            --notes "Install FlipVault-Pro-Android-preview.apk on Android, or host the web ZIP on HTTPS. The APK is a debug-signed sideload preview, not a Play Store release. Browser integration and offline tests passed; physical Realme 9i testing is still needed. Back up your vault before uninstalling or replacing an earlier preview. See README for features, backup/recovery instructions and known limitations." \
            FlipVault-Pro-Android-preview.apk FlipVault-Pro-web.zip
