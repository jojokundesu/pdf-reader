name: Explicit side-by-side Android preview download
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  preview:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Use Android SDK
        run: |
          echo "sdk.dir=$ANDROID_HOME" > android/local.properties
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0"
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx cap sync android
      - name: Assemble explicitly separate preview app
        working-directory: android
        run: |
          chmod +x gradlew
          set +e
          ./gradlew :app:assembleDebug -PflipvaultSideBySidePreview=true --no-daemon > preview-build.log 2>&1
          RESULT=$?
          tail -100 preview-build.log
          if [ "$RESULT" -ne 0 ]; then
            node -e "let s=require('fs').readFileSync('preview-build.log','utf8').slice(-3500);console.log('::error::'+s.replace(/%/g,'%25').replace(/\n/g,'%0A').replace(/\r/g,'%0D'))"
            exit "$RESULT"
          fi
      - name: Verify this APK cannot replace the user's existing main app
        run: |
          APK=android/app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK"
          "$ANDROID_HOME/build-tools/35.0.0/aapt" dump badging "$APK" > preview-badging.txt
          grep -q "package: name='com.flipvault.pro.preview'" preview-badging.txt
          grep -q "application-label:'FlipVault Preview'" preview-badging.txt
          python - <<'PY'
          import zipfile, hashlib
          with zipfile.ZipFile('android/app/build/outputs/apk/debug/app-debug.apk') as apk:
              sound = [n for n in apk.namelist() if n.startswith('assets/public/assets/page-turn-') and n.endswith('.mp3')]
              assert len(sound) == 1
              assert hashlib.sha256(apk.read(sound[0])).hexdigest() == '543118ab2c6c9268b0ab0070ebdb1ec29d5cabd12bceeee67af184ccb3c39c51'
          PY
      - name: Publish requested preview download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION=$(node -p "JSON.parse(require('fs').readFileSync('package.json')).version")
          APK="FlipVault-Pro-${VERSION}-side-by-side-preview.apk"
          WEB="FlipVault-Pro-${VERSION}-web.zip"
          cp android/app/build/outputs/apk/debug/app-debug.apk "$APK"
          (cd dist && zip -q -r "../$WEB" .)
          gh release create "side-preview-${GITHUB_SHA:0:7}" --target "$GITHUB_SHA" --prerelease \
            --title "FlipVault Pro ${VERSION} · Review preview (separate app)" \
            --notes "Review-only preview for ${VERSION}. Installs as FlipVault Preview (com.flipvault.pro.preview) next to FlipVault Pro and keeps its own library; it is deliberately signed with a temporary debug key and cannot update the main app. Do not install this as an update to the production app. The web zip is the same candidate reader. No stable release is created or modified by this workflow. Physical-device reading, install and performance verification remain the reviewer's responsibility." \
            "$APK" "$WEB"
